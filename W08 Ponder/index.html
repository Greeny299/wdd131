<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objects Ponder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1 id="courseName"></h1>
      <h2 id="courseCode"></h2>

      <label for="sectionNumber">Section Number</label>
      <input id="sectionNumber" type="number" />
      <button id="enrollStudent">Enroll Student</button>

      <table>
        <thead>
          <tr>
            <th>Section#</th>
            <th>Room#</th>
            <th>#Enrolled</th>
            <th>Days</th>
            <th>Instructor</th>
          </tr>
        </thead>
        <tbody id="sections"></tbody>
      </table>
    </main>

    <script src="script.js"></script>
  </body>
</html>
