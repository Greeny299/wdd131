<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse and search a collection of family recipes." />
    <meta name="author" content="Greeny299" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Recipe Book" />
    <meta property="og:description" content="Browse and search a collection of family recipes." />
    <meta property="og:url" content="https://greeny299.github.io/wdd131/recipes/" />
    <meta property="og:image" content="https://greeny299.github.io/wdd131/recipes/images/social-preview-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Recipe Book" />
    <meta name="twitter:description" content="Browse and search a collection of family recipes." />
    <meta name="twitter:image" content="https://greeny299.github.io/wdd131/recipes/images/social-preview-image.jpg" />
    <link rel="icon" href="images/recipe-book.png" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="recipes.css" />
    <title>Recipe Book</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Recipe Book home">
        <img src="images/recipe-book.png" alt="" />
        <span>Recipe Book</span>
      </a>

      <form class="search" id="search-form" role="search">
        <label class="visually-hidden" for="recipe-search">Search recipes</label>
        <input id="recipe-search" type="search" placeholder="Find a recipe" autocomplete="off" />
        <button type="submit" aria-label="Search recipes">
          <img src="images/search.svg" alt="" />
        </button>
      </form>
    </header>

    <main>
      <p class="results-status" id="results-status" aria-live="polite"></p>
      <section class="recipe-list" id="recipe-list" aria-label="Recipes"></section>
    </main>

    <footer class="site-footer">
      <a class="flaticon-credit" href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
      <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
        <a href="https://www.instagram.com/" aria-label="Instagram"><img src="images/instagram_icon.svg" alt="" /></a>
        <a href="https://www.youtube.com/" aria-label="YouTube"><img src="images/youtube_icon.svg" alt="" /></a>
        <a href="https://www.pinterest.com/" aria-label="Pinterest"><img src="images/pinterest_icon.svg" alt="" /></a>
      </div>
    </footer>
    <script src="recipes.js"></script>
  </body>
</html>
