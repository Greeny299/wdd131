<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FSY Counselor Preference Form</title>
    <link rel="icon" href="favicon.ico" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #cfe0cf;
        margin: 0;
      }

      .wrapper {
        max-width: 850px;
        margin: 50px auto;
        padding: 20px;
        background: white;
        border-radius: 12px;
      }

      form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .full {
        grid-column: 1 / 3;
      }

      input,
      select,
      button {
        padding: 0.6rem;
        font: inherit;
      }

      button {
        background: #cfe0cf;
        transition: background 0.5s ease;
        margin-top: 10px;
      }

      button:hover {
        background: #dcead9;
      }

      .campus-group {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 15px;
      }

      .campus-group legend {
        font-weight: bold;
        padding: 0 0.25rem;
      }

      .campus-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem 1rem;
        margin-top: 0.75rem;
      }

      .campus-grid label {
        display: block;
        line-height: 1.3;
        font-size: 0.8em;
      }

      .campus-grid input {
        margin-right: 0.5rem;
      }

      #notesContainer[hidden] {
        display: none;
      }

      #output {
        margin-top: 1rem;
        font-weight: bold;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("#fsyForm");
        const travelRange = document.querySelector("#travelRange");
        const notesContainer = document.querySelector("#notesContainer");
        const notes = document.querySelector("#notes");
        const output = document.querySelector("#output");
        const campusBoxes = document.querySelectorAll('input[name="campus"]');

        function updateNotesField() {
          const value = travelRange.value;

          if (value === "many") {
            notesContainer.hidden = false;
            notes.setAttribute("required", "required");
          } else {
            notesContainer.hidden = true;
            notes.removeAttribute("required");
            notes.value = "";
          }
        }

        travelRange.addEventListener("change", updateNotesField);
        updateNotesField();

        function isPastDate(value) {
          const today = new Date();
          const chosen = new Date(value);
          return chosen < today;
        }

        function getSelectedCampuses() {
          return Array.from(campusBoxes)
            .filter((box) => box.checked)
            .map((box) => box.value);
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          output.textContent = "";

          const firstName = form.firstName.value.trim();
          const lastName = form.lastName.value.trim();
          const email = form.email.value.trim();
          const type = form.travelRange.value;
          const availableDate = form.availableDate.value;
          const selectedCampuses = getSelectedCampuses();
          const note = form.notes.value.trim();

          if (selectedCampuses.length === 0) {
            output.textContent = "Please select at least one campus.";
            return;
          }

          if (type === "many" && note.length === 0) {
            output.textContent = "Please add a travel note.";
            return;
          }

          if (type === "many" && selectedCampuses.length < 2) {
            output.textContent = "Please select at least two campuses.";
            return;
          }

          if (isPastDate(availableDate)) {
            output.textContent = "Please choose a later date.";
            return;
          }

          output.innerHTML = `
            <h2>Preference Submitted</h2>
            <p>${firstName} ${lastName}</p>
            <p>Email: ${email}</p>
            <p>Availability: ${availableDate}</p>
            <p>Campuses: ${selectedCampuses.join(", ")}</p>
            <p>Preference Level: ${type}</p>
          `;

          form.reset();
          updateNotesField();
        });
      });
    </script>
  </head>
  <body>
    <main class="wrapper">
      <h1>FSY Counselor Preference Form</h1>

      <form id="fsyForm">
        <div class="field">
          <label for="firstName">First Name</label>
          <input id="firstName" name="firstName" type="text" required />
        </div>

        <div class="field">
          <label for="lastName">Last Name</label>
          <input id="lastName" name="lastName" type="text" required />
        </div>

        <div class="field full">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>

        <div class="field">
          <label for="travelRange">Willing to Serve In</label>
          <select id="travelRange" name="travelRange" aria-controls="notesContainer" required>
            <option value="">Choose one</option>
            <option value="one">One campus</option>
            <option value="many">Two or more campuses</option>
          </select>
        </div>

        <div class="field">
          <label for="availableDate">Available Start Date</label>
          <input id="availableDate" name="availableDate" type="date" required />
        </div>

        <fieldset class="full campus-group">
          <legend>Campuses you are willing to serve at</legend>

          <div class="campus-grid">
            <label><input type="checkbox" name="campus" value="BYU - Provo, Utah" /> Brigham Young University (BYU) - Provo, Utah</label>
            <label><input type="checkbox" name="campus" value="BYU-Idaho - Rexburg, Idaho" /> Brigham Young University-Idaho (BYU-Idaho) - Rexburg, Idaho</label>
            <label><input type="checkbox" name="campus" value="Southern Virginia University - Buena Vista, Virginia" /> Southern Virginia University - Buena Vista, Virginia</label>
            <label><input type="checkbox" name="campus" value="University of Maryland - College Park, Maryland" /> University of Maryland - College Park, Maryland</label>
            <label><input type="checkbox" name="campus" value="University of North Georgia - Dahlonega, Georgia" /> University of North Georgia - Dahlonega, Georgia</label>
            <label><input type="checkbox" name="campus" value="San Diego State University - San Diego, California" /> San Diego State University - San Diego, California</label>
            <label><input type="checkbox" name="campus" value="University of Idaho - Moscow, Idaho" /> University of Idaho - Moscow, Idaho</label>
            <label><input type="checkbox" name="campus" value="Utah State University - Logan, Utah" /> Utah State University - Logan, Utah</label>
            <label><input type="checkbox" name="campus" value="Pacific Lutheran University - Tacoma, Washington" /> Pacific Lutheran University - Tacoma, Washington</label>
            <label><input type="checkbox" name="campus" value="Stetson University - DeLand, Florida" /> Stetson University - DeLand, Florida</label>
          </div>
        </fieldset>

        <div id="notesContainer" class="field full" hidden>
          <label for="notes">Travel Notes</label>
          <input id="notes" name="notes" type="text" />
        </div>

        <button class="full" type="submit">Submit Preferences</button>
      </form>

      <section id="output" aria-live="polite"></section>
    </main>
  </body>
</html>
